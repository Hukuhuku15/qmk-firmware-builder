name: Build Custom Firmware

on:
  push:
  workflow_dispatch:

env:
  QMK_REPO: vial-kb/vial-qmk
  QMK_BRANCH: vial

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli

    steps:

    - name: Checkout custom keymaps
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Clone QMK fork
      run: | 
        git clone --no-checkout https://github.com --depth 1 --branch $QMK_BRANCH ./qmk_firmware

    - name: Determine & Checkout relevant keyboards
      working-directory: ./qmk_firmware
      run: |
        git config core.sparsecheckout true
        printf '/*\n!/keyboards\n' > .git/info/sparse-checkout
        for kb in $(find ../keyboards -depth -type d |  awk '$0 !~ /keymaps/' | awk -F / 'NF>=p; {p=NF}' |sed 's/..//'); do echo "$kb/*" >> .git/info/sparse-checkout; done;
        printf '!/keyboards/**/keymaps\n' >> .git/info/sparse-checkout
        git checkout $QMK_BRANCH --

    - name: Set Up QMK
      working-directory: ./qmk_firmware
      run: |
        qmk setup -y

    - name: Copy keymap
      run: |
        mkdir -p qmk_firmware/keyboards/
        cp -rup ./keyboards/* ./qmk_firmware/keyboards/

    # --- 新しいPython環境でのQMKのバグ（ast.Num問題）を強制修正するステップ ---
    - name: Patch QMK Python Library for newer Python versions
      working-directory: ./qmk_firmware
      run: |
        sed -i "s/isinstance(node, ast.Num):/isinstance(node, ast.Constant) and isinstance(node.value, (int, float)):/g" lib/python/qmk/math.py
        sed -i "s/return node.n/return node.value/g" lib/python/qmk/math.py

    - name: Compile Custom Firmware (Left & Right)
      working-directory: ./qmk_firmware
      run: |
        # 事前にビルド環境をクリーンアップ
        make clean

        echo "=== Building LEFT side ==="
        make all EXTRAFLAGS+="-DINIT_EE_HANDS_LEFT"
        
        # 左用ビルド成果物のファイル名末尾に _left を付与して「別フォルダ」へ退避（衝突回避のため）
        mkdir -p ../output_artifacts
        for f in *.hex *.bin *.uf2; do
          if [ -f "$f" ]; then
            mv "$f" "../output_artifacts/${f%.*}_left.${f##*.}"
          fi
        done

        # 次のビルドのためにオブジェクトファイルを完全にクリーンアップ
        make clean

        echo "=== Building RIGHT side ==="
        make all EXTRAFLAGS+="-DINIT_EE_HANDS_RIGHT"
        
        # 右用ビルド成果物のファイル名末尾に _right を付与して「別フォルダ」へ退避
        for f in *.hex *.bin *.uf2; do
          if [ -f "$f" ]; then
            mv "$f" "../output_artifacts/${f%.*}_right.${f##*.}"
          fi
        done

        # 成果物を本来の場所（後続のステップが見にいく場所）に戻す
        mv ../output_artifacts/* .

    - name: Upload compiled firmware (build artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Firmware Files
        path: |
          ./qmk_firmware/*_left.hex
          ./qmk_firmware/*_left.bin
          ./qmk_firmware/*_left.uf2
          ./qmk_firmware/*_right.hex
          ./qmk_firmware/*_right.bin
          ./qmk_firmware/*_right.uf2

    - name: Upload compiled firmware (tagged release)
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          ./qmk_firmware/*_left.hex
          ./qmk_firmware/*_left.bin
          ./qmk_firmware/*_left.uf2
          ./qmk_firmware/*_right.hex
          ./qmk_firmware/*_right.bin
          ./qmk_firmware/*_right.uf2
