name: Build Custom Firmware

on:
  push:
  workflow_dispatch:

env:
  QMK_REPO: vial-kb/vial-qmk
  QMK_BRANCH: vial
  KB_TARGET: split_lotus_ib:vial

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli

    steps:

    - name: Checkout custom keymaps
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Clone QMK fork
      run: |
        git clone --no-checkout https://github.com/$QMK_REPO.git --depth 1 --branch $QMK_BRANCH ./qmk_firmware

    - name: Determine & Checkout relevant keyboards
      working-directory: ./qmk_firmware
      run: |
        git config core.sparsecheckout true
        printf '/*\n!/keyboards\n' > .git/info/sparse-checkout
        for kb in $(find ../keyboards -depth -type d |  awk '$0 !~ /keymaps/' | awk -F / 'NF>=p; {p=NF}' |sed 's/..//'); do echo "$kb/*" >> .git/info/sparse-checkout; done;
        printf '!/keyboards/**/keymaps\n' >> .git/info/sparse-checkout
        git checkout $QMK_BRANCH --

    # qmk setup は使わない。vial-qmk のフォルダを明示的に QMK_HOME に指定する
    - name: Set Up QMK
      working-directory: ./qmk_firmware
      run: |
        git submodule update --init --recursive --depth 1
        pip3 install -r requirements.txt || true
        qmk config user.qmk_home=$PWD
        echo "QMK_HOME=$PWD" >> $GITHUB_ENV

    - name: Copy keymap
      run: |
        mkdir -p qmk_firmware/keyboards/
        cp -rup ./keyboards/* ./qmk_firmware/keyboards/

    # 新しいPython環境でのQMKのバグ（ast.Num問題）を修正
    - name: Patch QMK Python Library for newer Python versions
      working-directory: ./qmk_firmware
      run: |
        sed -i "s/isinstance(node, ast.Num):/isinstance(node, ast.Constant) and isinstance(node.value, (int, float)):/g" lib/python/qmk/math.py || true
        sed -i "s/return node.n/return node.value/g" lib/python/qmk/math.py || true

    - name: Compile Custom Firmware (Left & Right)
      working-directory: ./qmk_firmware
      run: |
        set -e
        export QMK_HOME=$PWD
        mkdir -p ../output_artifacts

        make clean
        echo "=== Building LEFT side ==="
        make $KB_TARGET EXTRAFLAGS+="-DINIT_EE_HANDS_LEFT"
        for f in *.hex *.bin *.uf2; do
          if [ -f "$f" ]; then
            mv "$f" "../output_artifacts/${f%.*}_left.${f##*.}"
          fi
        done

        make clean
        echo "=== Building RIGHT side ==="
        make $KB_TARGET EXTRAFLAGS+="-DINIT_EE_HANDS_RIGHT"
        for f in *.hex *.bin *.uf2; do
          if [ -f "$f" ]; then
            mv "$f" "../output_artifacts/${f%.*}_right.${f##*.}"
          fi
        done

        ls -l ../output_artifacts
        mv ../output_artifacts/* .

    - name: Upload compiled firmware (build artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Firmware Files
        path: |
          ./qmk_firmware/*_left.hex
          ./qmk_firmware/*_left.bin
          ./qmk_firmware/*_left.uf2
          ./qmk_firmware/*_right.hex
          ./qmk_firmware/*_right.bin
          ./qmk_firmware/*_right.uf2

    - name: Upload compiled firmware (tagged release)
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          ./qmk_firmware/*_left.hex
          ./qmk_firmware/*_left.bin
          ./qmk_firmware/*_left.uf2
          ./qmk_firmware/*_right.hex
          ./qmk_firmware/*_right.bin
          ./qmk_firmware/*_right.uf2
